<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c8edff">
    <title>Admin Dashboard</title>
    <style>
        :root {
            color-scheme: light;
            --sky: #c8edff;
            --cream: #fff3c4;
            --ink: #28233c;
            --muted: #5d5870;
            --paper: #fffdf7;
            --coral: #ff6b6b;
            --yellow: #ffd166;
            --mint: #d9f5e6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            overflow-x: hidden;
            background: linear-gradient(180deg, var(--sky), var(--cream));
            color: var(--ink);
            font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            font-size: 64px;
            pointer-events: none;
            content: "\2601";
            animation: cloud-drift 32s linear infinite;
        }

        body::before {
            top: 12%;
            left: -100px;
        }

        body::after {
            top: 64%;
            left: -180px;
            opacity: 0.65;
            animation-delay: -16s;
        }

        .dashboard {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        .dashboard-header {
            margin-bottom: 32px;
            text-align: center;
        }

        .dashboard-header h1 {
            display: inline-block;
            margin: 0;
            padding: 12px 24px;
            transform: rotate(-1deg);
            border: 3px solid var(--ink);
            border-radius: 18px;
            background: var(--yellow);
            box-shadow: 5px 5px 0 var(--ink);
            font-size: clamp(2rem, 7vw, 3rem);
        }

        .dashboard-header p {
            margin: 20px 0 0;
            color: var(--muted);
        }

        .card {
            margin-bottom: 24px;
            padding: 28px;
            border: 3px solid var(--ink);
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 1.5rem;
        }

        .visitor-count {
            margin: 0;
            color: var(--coral);
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
        }

        .message-list {
            display: grid;
            gap: 16px;
        }

        .message-card {
            padding: 18px;
            border: 2px solid var(--ink);
            border-radius: 16px;
            background: var(--mint);
            overflow-wrap: anywhere;
        }

        .message-card h3 {
            margin: 0 0 8px;
        }

        .message-card p {
            margin: 8px 0 0;
        }

        .empty-state {
            margin: 0;
            color: var(--muted);
        }

        @keyframes cloud-drift {
            to {
                transform: translateX(calc(100vw + 280px));
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 16px;
            }

            .card {
                padding: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Ringkasan aktivitas portfolio</p>
        </header>

        <section class="card" aria-labelledby="visitorTitle">
            <h2 id="visitorTitle">Total Visitors</h2>
            <p class="visitor-count" id="visitorCount" aria-live="polite">Loading...</p>
        </section>

        <section class="card" aria-labelledby="messagesTitle">
            <h2 id="messagesTitle">Pesan Masuk</h2>
            <div class="message-list" id="messagesList" aria-live="polite">
                <p class="empty-state">Loading...</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
